name: Deploy Frontend (main) to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend to S3 (Production Optimized)
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # 4️⃣ Build frontend
      - name: Build project
        run: npm run build

      #################################################################
      # 🧠 Better Change Detection (SAFE)
      #################################################################
      - name: Check for meaningful changes
        id: changes
        run: |
          if git diff --quiet HEAD~1 HEAD -- dist/; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        if: steps.changes.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      #################################################################
      # 🚀 OPTIMIZED DEPLOYMENT
      #################################################################

      # 6️⃣ Upload STATIC ASSETS (LONG CACHE, NO DELETE)
      - name: Upload static assets
        if: steps.changes.outputs.skip == 'false'
        run: |
          aws s3 sync dist/assets/ s3://${{ secrets.S3_BUCKET_NAME_PROD }}/assets/ \
            --size-only \
            --exclude "*.map" \
            --cache-control "public,max-age=31536000,immutable"

      # 7️⃣ Upload remaining files (NO DELETE)
      - name: Upload remaining files
        if: steps.changes.outputs.skip == 'false'
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME_PROD }} \
            --size-only \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=86400"

      # 8️⃣ Upload index.html (NO CACHE)
      - name: Upload index.html
        if: steps.changes.outputs.skip == 'false'
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME_PROD }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # 9️⃣ Invalidate minimal paths
      - name: Invalidate CloudFront cache
        if: steps.changes.outputs.skip == 'false'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/index.html" "/"
